plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// ModDevGradle adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// NeoForge 1.21.1 port in progress: sources not yet ported to NeoForge/1.21.1
// are excluded from compilation (see TODO-PORT-NEOFORGE-1.21.1.md). Remove
// entries as they are ported. Fabric-only resources are excluded for the same reason.
sourceSets {
	main {
		java {
			// Needs checking against 1.21.1's alpha handling before porting
			exclude 'dev/evvie/waylandcraft/render/WindowTranslucencyHotfix.java'
		}
		resources {
			exclude 'fabric.mod.json'
			exclude 'waylandcraft.classtweaker'
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	compileOnly "maven.modrinth:iris:${project.iris_version}"
	// Pure-Java Opus for window sharing audio, bundled so every client can decode it
	jarJar(implementation("io.github.jaredmdobson:concentus")) {
		version {
			strictly "[${project.concentus_version},)"
			prefer project.concentus_version
		}
	}
	// Pure-Java H.264 for window sharing video, bundled for the same reason
	jarJar(implementation("org.jcodec:jcodec")) {
		version {
			strictly "[${project.jcodec_version},)"
			prefer project.jcodec_version
		}
	}
}

def modProperties = [
	mod_id: project.mod_id,
	version: project.version,
	minecraft_version_range: project.minecraft_version_range,
	neo_version_range: project.neo_version_range,
	loader_version_range: project.loader_version_range,
]

processResources {
	inputs.properties modProperties

	filesMatching("META-INF/neoforge.mods.toml") {
		expand modProperties
	}
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library
	def nativeFile = file("native/target/debug/libwaylandcraft.so")
	if(nativeFile.exists()) {
		from(nativeFile)
		natives.add("host")
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases
	def targets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	];

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			gameDirectory = project.file('run')
			// need to append, otherwise we get "Driver does not support OpenGL" in Nix containers
			environment("LD_LIBRARY_PATH",
				[project.file("native/target/debug").absolutePath, System.getenv("LD_LIBRARY_PATH")]
					.findAll { it }.join(":"))
			environment("__GL_THREADED_OPTIMIZATIONS", "0")
			environment("RUST_BACKTRACE", "1")
		}
		// Second client for testing window sharing between two players (e.g. against runServer)
		client2 {
			client()
			gameDirectory = project.file('run-client2')
			programArguments.addAll('--username', 'Viewer')
		}
		server {
			server()
			gameDirectory = project.file('run-server')
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Non-mod libraries must be put on the dev run classpath explicitly
// (this configuration exists once the neoForge block above is evaluated)
dependencies {
	additionalRuntimeClasspath "io.github.jaredmdobson:concentus:${project.concentus_version}"
	additionalRuntimeClasspath "org.jcodec:jcodec:${project.jcodec_version}"
}
